<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1E7">
  <title>Menú familiar</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="16" cy="17" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="17" r="6" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".5"/><path d="M5 4v7M3 4v4a2 2 0 0 0 4 0V4M27 4c-2 1-3 4-3 7h3V4z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </span>
      <h1>Menú familiar</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button data-view="week" class="active" role="tab">Semana</button>
      <button data-view="month" role="tab">Mes</button>
      <button data-view="shop" role="tab">Compra</button>
      <button data-view="settings" role="tab" aria-label="Ajustes">Ajustes</button>
    </nav>
  </header>

  <main id="view" aria-live="polite"></main>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <div class="dlg-actions">
        <button value="cancel" class="btn ghost" type="submit" formnovalidate>Cancelar</button>
        <button value="ok" class="btn primary" id="dlg-ok" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <datalist id="recipe-list"></datalist>
  <script src="/static/app.js"></script>
</body>
</html>

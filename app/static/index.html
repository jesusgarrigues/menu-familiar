<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Menú familiar</title>
  <meta name="description" content="Lo que comen los niños en el cole, ideas de cenas, menú del fin de semana y lista de la compra.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)">
  <!-- Web app instalable -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Menú">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/static/styles.css?v=5">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-view="home" class="active">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Inicio</span>
    </button>
    <button data-view="month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Mes</span>
    </button>
    <button data-view="shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.4 11.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span>Compra</span><b class="count" id="shop-count" hidden></b>
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

  <dialog id="sheet">
    <form method="dialog" id="sheet-form">
      <div class="grabber" aria-hidden="true"></div>
      <h2 id="sheet-title"></h2>
      <div id="sheet-body"></div>
      <div class="sheet-actions">
        <button value="cancel" class="btn ghost" type="submit" formnovalidate>Cancelar</button>
        <button value="ok" class="btn primary" id="sheet-ok" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="daysheet" aria-label="Detalle del día">
    <div class="grabber" aria-hidden="true"></div>
    <div id="daysheet-body"></div>
  </dialog>

  <div id="toast" role="status"></div>
  <datalist id="recipe-list"></datalist>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
